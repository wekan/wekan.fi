name: Release All
on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared website release version
        required: true
        type: string
permissions:
  contents: write
  deployments: read
  pages: write
  id-token: write
jobs:
  deploy:
    uses: ./.github/workflows/static.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
